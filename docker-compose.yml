name: psicol

x-backend: &backend
  image: psicol-php
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
  environment: &backend-env
    APP_NAME: Psicol
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_KEY: ${APP_KEY:-}
    APP_URL: ${APP_URL:-http://localhost:8080}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-incidents}
    DB_USERNAME: ${DB_USERNAME:-incidents}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    QUEUE_CONNECTION: sync
    CACHE_STORE: database
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-psicol}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-psicol-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-psicol-secret}
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    SEED_INCIDENTS: ${SEED_INCIDENTS:-5000}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # Flags instead of a conf.d bind mount: MySQL ignores world-writable config files (Docker Desktop on Windows).
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-incidents}
      MYSQL_USER: ${DB_USERNAME:-incidents}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 forces TCP, which the temporary init server does not open.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    <<: *backend
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  reverb:
    <<: *backend
    # Same image as app, built once by the app service.
    pull_policy: never
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-psicol-key}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  app-storage:
